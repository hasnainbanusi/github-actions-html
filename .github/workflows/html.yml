name: HTML CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          echo "index.html exists successfully"

      - name: Display HTML
        run: cat index.html
